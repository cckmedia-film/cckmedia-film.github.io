<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCK Media · film</title>
<meta name="description" content="Сценарии, аниматики и раскадровки CCK Media.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#110e1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23110e1f'/%3E%3Crect x='10' y='18' width='44' height='28' rx='4' fill='none' stroke='%23a28bff' stroke-width='4'/%3E%3Cpath d='M28 25v14l12-7z' fill='%233fd6a0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: studio index — name, then a grid of project cards (one per storyboard) */
:root{--bg:#110e1f;--surface:#1a1630;--fg:#ece9f7;--muted:#a39dc2;--line:#2d2850;--violet:#a28bff;--emerald:#3fd6a0;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;--f-body:"Manrope",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
img{max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:72px 40px}
.eyebrow{font:12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--emerald)}
h1{font:700 clamp(34px,7vw,68px)/1.02 var(--f-display);margin:14px 0 12px;letter-spacing:-.01em}
h1 span{color:var(--violet)}
.lead{color:var(--muted);max-width:52ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px;padding-block:0 80px}
a.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
a.card:hover,a.card:focus-visible{border-color:var(--violet);transform:translateY(-2px);outline:none}
a.card img{display:block;aspect-ratio:1200/630;object-fit:cover;width:100%}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.client{font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cb h2{font:500 17px/1.3 var(--f-display);margin:0}
.tags{display:flex;gap:8px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--emerald)}
footer{color:var(--muted);font-size:13px;padding-block:0 40px}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<header class="wrap">
  <div class="eyebrow">cckmedia-film.github.io</div>
  <h1>CCK Media<span>.</span>film</h1>
  <p class="lead">Сценарии, аниматики и раскадровки к нашим роликам. Ссылку на проект присылаем клиенту и команде.</p>
</header>
<main class="wrap grid">
  <a class="card" href="gadzhiev-lkz/">
    <img src="gadzhiev-lkz/og.jpg" alt="Кадр из раскадровки: курьер в мокрых очках под неоновым дождём">
    <div class="cb">
      <span class="client">Глазная клиника доктора Гаджиева · 29.10.26</span>
      <h2>Лазерная коррекция зрения: «Враг в очках» и «Жест»</h2>
      <div class="tags"><span>15 с · ТВ</span><span>30 с · сайт</span><span>2 варианта</span><span>аниматик</span></div>
    </div>
  </a>
</main>
<footer class="wrap">© CCK Media</footer>
</body>
</html>
